/* ---------- палитры ---------- */
const palettes = [

function lerp(a,b,t){ return a + (b-a)*t; }
function paletteColor(pal, t){
  t = Math.min(0.9999, Math.max(0, t));
  const n = pal.length - 1;
  const i = Math.floor(t * n);
  const f = t * n - i;
  const c1 = pal[i], c2 = pal[Math.min(n, i+1)];
  return [
    Math.round(lerp(c1[0], c2[0], f)),
    Math.round(lerp(c1[1], c2[1], f)),
    Math.round(lerp(c1[2], c2[2], f))
  ];
}
function paletteCSS(pal, t){
  const [r,g,b] = paletteColor(pal, t);
  return `rgb(${r},${g},${b})`;
}
function randomPalette(){ return palettes[Math.floor(Math.random()*palettes.length)]; }

/* ---------- статистика ---------- */

/* ============================================================
   ЯДРО: СТРОЯЩИЙСЯ ФРАКТАЛ
   ============================================================ */

// Каждый фрактал — это список "операций", которые проигрываются
// кадр за кадром. Фрактал появляется на экране постепенно.

/* ---------- escape-time: строим по пикселям блоками ---------- */
class GrowingEscapeFractal {
  constructor(formula, region, iter, pal, opts={}){
    this.formula = formula;
    this.region = region;
    this.iter = iter;
    this.pal = pal;
    this.born = performance.now();

    // Холст
    this.W = opts.w || 480;
    this.H = opts.h || 270;
    this.cv = document.createElement('canvas');
    this.cv.width = this.W;
    this.cv.height = this.H;
    this.cctx = this.cv.getContext('2d');
    this.cctx.fillStyle = '#000';
    this.cctx.fillRect(0,0,this.W,this.H);

    // Позиция на главном экране
    const fullScale = Math.max(W/this.W, H/this.H) * (0.75 + Math.random()*0.4);
    this.scale = fullScale;
    this.x = (W - this.W * fullScale) * Math.random();
    this.y = (H - this.H * fullScale) * Math.random();

    // Прогресс построения
    this.progress = 0;
    this.buildSpeed = opts.buildSpeed || (0.008 + Math.random()*0.012); // доля за кадр

    // Жизненный цикл
    this.state = 'building'; // building → hold → fading
    this.holdUntil = 0;
    this.alpha = 0;
    this.targetAlpha = 0.7 + Math.random()*0.25;
    this.fadeInDur = 0; // нет отдельного fade-in — плавно наращивается через progress

    // Градиент (создаём один раз)
    this.gradient = null;

    // Строки, которые уже отрисованы
    this.currentRow = 0;

    // смещение палитры
    this.colorOffset = Math.random();
  }

  // Отрисовка одной строки (или блока строк) escape-time фрактала
  renderRows(count){
    const { W: fw, H: fh, region, iter, pal, colorOffset } = this;
    const aspect = fh / fw;
    const scale = 3.0 / region.zoom;

    const startRow = this.currentRow;
    const endRow = Math.min(fh, startRow + count);
    if (endRow <= startRow) return;

    const imgData = this.cctx.getImageData(0, startRow, fw, endRow - startRow);
    const data = imgData.data;
    let idx = 0;

    for (let py = startRow; py < endRow; py++){
      for (let px = 0; px < fw; px++){
        const x0 = (px / fw - 0.5) * scale + region.cx;
        const y0 = (py / fh - 0.5) * scale * aspect + region.cy;
        let zx = 0, zy = 0, i = 0, esc = 0;
        while (i < iter){
          const r = this.formula(x0, y0, zx, zy, i);
          zx = r[0]; zy = r[1]; esc = r[2];
          if (!isFinite(esc) || esc > 4) break;
          i++;
        }
        if (i >= iter){
          data[idx]=0; data[idx+1]=0; data[idx+2]=0; data[idx+3]=255;
        } else {
          const safeEsc = Math.max(1.0001, esc);
          const smooth = i + 1 - Math.log(Math.log(Math.sqrt(safeEsc))) / Math.log(2);
          const t = ((smooth / iter) + colorOffset) % 1;
          const [r,g,b] = paletteColor(pal, t);
          data[idx]=r; data[idx+1]=g; data[idx+2]=b; data[idx+3]=255;
        }
        idx += 4;
      }
    }
    this.cctx.putImageData(imgData, 0, startRow);
    this.currentRow = endRow;
    this.progress = this.currentRow / fh;
  }

  update(now){
    if (this.state === 'building'){
      // Строим несколько строк за кадр — быстро, но видно как идёт
      const rowsPerFrame = Math.max(2, Math.ceil(this.H * this.buildSpeed));
      this.renderRows(rowsPerFrame);
      this.alpha = this.targetAlpha * Math.min(1, this.progress * 1.5);
      if (this.currentRow >= this.H){
        this.state = 'hold';
        this.holdUntil = now + 4000 + Math.random()*4000;
      }
    } else if (this.state === 'hold'){
      this.alpha = this.targetAlpha;
      if (now > this.holdUntil){
        this.state = 'fading';
        this.fadeStart = now;
      }
    } else if (this.state === 'fading'){
      const t = Math.min(1, (now - this.fadeStart) / 2000);
      this.alpha = this.targetAlpha * (1 - t*t);
      if (t >= 1) this.state = 'dead';
    }
  }

  draw(mainCtx){
    if (this.alpha <= 0.001) return;
    mainCtx.save();
    mainCtx.globalCompositeOperation = 'screen';
    mainCtx.globalAlpha = this.alpha;
    mainCtx.drawImage(this.cv, this.x, this.y, this.W*this.scale, this.H*this.scale);
    mainCtx.restore();
  }

  isDead(){ return this.state === 'dead'; }
}

/* ---------- ЛИНЕЙНЫЕ ФРАКТАЛЫ: строятся по сегментам ---------- */
class GrowingVectorFractal {
  constructor(segments, pal, opts={}){
    // segments: [{x1,y1,x2,y2,delay}] в координатах экрана
    this.segments = segments;
    this.pal = pal;
    this.born = performance.now();
    this.drawnCount = 0;

    this.state = 'building';
    this.alpha = 0;
    this.targetAlpha = 0.75 + Math.random()*0.2;
    this.holdUntil = 0;

    // Скорость: сколько сегментов за кадр. Адаптивно к общему числу.
    const total = segments.length;
    this.perFrame = Math.max(1, Math.ceil(total / 180)); // ~3 сек на полное построение
    this.buildStart = performance.now();
    this.buildDuration = opts.buildDuration || 2500;
  }

  update(now){
    if (this.state === 'building'){
      const t = Math.min(1, (now - this.buildStart) / this.buildDuration);
      // easeOut — сначала быстро, потом медленнее
      const e = 1 - Math.pow(1-t, 2.5);
      this.drawnCount = Math.floor(e * this.segments.length);
      this.alpha = this.targetAlpha * Math.min(1, t * 2);
      if (t >= 1){
        this.state = 'hold';
        this.holdUntil = now + 4000 + Math.random()*3000;
      }
    } else if (this.state === 'hold'){
      this.alpha = this.targetAlpha;
      if (now > this.holdUntil){
        this.state = 'fading';
        this.fadeStart = now;
      }
    } else if (this.state === 'fading'){
      const t = Math.min(1, (now - this.fadeStart) / 2000);
      this.alpha = this.targetAlpha * (1 - t*t);
      if (t >= 1) this.state = 'dead';
    }
  }

  draw(mainCtx){
    if (this.alpha <= 0.001) return;
    mainCtx.save();
    mainCtx.globalAlpha = this.alpha;
    mainCtx.lineCap = 'round';
    mainCtx.lineJoin = 'round';

    const n = this.drawnCount;
    // группируем по цвету — для скорости
    const groups = new Map();
    for (let i=0;i<n;i++){
      const s = this.segments[i];
      const key = s.color;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    for (const [color, segs] of groups){
      mainCtx.strokeStyle = color;
      mainCtx.lineWidth = segs[0].lw || 1.2;
      mainCtx.beginPath();
      for (const s of segs){
        mainCtx.moveTo(s.x1, s.y1);
        mainCtx.lineTo(s.x2, s.y2);
      }
      mainCtx.stroke();
    }
    mainCtx.restore();
  }

  isDead(){ return this.state === 'dead'; }
}

/* ---------- ТОЧЕЧНЫЕ АТТРАКТОРЫ: строятся по точкам ---------- */
class GrowingPointFractal {
  constructor(points, pal, opts={}){
    // points: [{x,y,r,color}]
    this.points = points;
    this.pal = pal;
    this.drawnCount = 0;
    this.state = 'building';
    this.alpha = 0;
    this.targetAlpha = 0.7 + Math.random()*0.25;
    this.buildStart = performance.now();
    this.buildDuration = opts.buildDuration || 3500;
    this.holdUntil = 0;
  }

  update(now){
    if (this.state === 'building'){
      const t = Math.min(1, (now - this.buildStart) / this.buildDuration);
      const e = 1 - Math.pow(1-t, 2.5);
      this.drawnCount = Math.floor(e * this.points.length);
      this.alpha = this.targetAlpha * Math.min(1, t * 2);
      if (t >= 1){
        this.state = 'hold';
        this.holdUntil = now + 4000 + Math.random()*3000;
      }
    } else if (this.state === 'hold'){
      this.alpha = this.targetAlpha;
      if (now > this.holdUntil){
        this.state = 'fading';
        this.fadeStart = now;
      }
    } else if (this.state === 'fading'){
      const t = Math.min(1, (now - this.fadeStart) / 2000);
      this.alpha = this.targetAlpha * (1 - t*t);
      if (t >= 1) this.state = 'dead';
    }
  }

  draw(mainCtx){
    if (this.alpha <= 0.001) return;
    mainCtx.save();
    mainCtx.globalAlpha = this.alpha;
    const n = this.drawnCount;
    // группируем по цвету
    const groups = new Map();
    for (let i=0;i<n;i++){
      const p = this.points[i];
      if (!groups.has(p.color)) groups.set(p.color, []);
      groups.get(p.color).push(p);
    }
    for (const [color, pts] of groups){
      mainCtx.fillStyle = color;
      for (const p of pts){
        mainCtx.fillRect(p.x, p.y, p.r, p.r);
      }
    }
    mainCtx.restore();
  }

  isDead(){ return this.state === 'dead'; }
}

/* ============================================================
   ФОРМУЛЫ
   ============================================================ */
const F = {
  mandelbrot: (cx, cy, zx, zy) => {
    const x2 = zx*zx, y2 = zy*zy;
    const nx = x2 - y2 + cx, ny = 2*zx*zy + cy;
    return [nx, ny, nx*nx + ny*ny];
  },
  julia: (jRe, jIm) => (cx, cy, zx, zy) => {
    let nx, ny;
    if (zx === 0 && zy === 0){ nx = cx; ny = cy; }
    else {
      const x2 = zx*zx, y2 = zy*zy;
      nx = x2 - y2 + jRe;
      ny = 2*zx*zy + jIm;
    }
    return [nx, ny, nx*nx + ny*ny];
  },
  burning_ship: (cx, cy, zx, zy) => {
    const x2 = zx*zx, y2 = zy*zy;
    const nx = x2 - y2 + cx;
    const ny = Math.abs(2*zx*zy) + cy;
    return [nx, ny, nx*nx + ny*ny];
  },
  tricorn: (cx, cy, zx, zy) => {
    const x2 = zx*zx, y2 = zy*zy;
    const nx = x2 - y2 + cx;
    const ny = -2*zx*zy + cy;
    return [nx, ny, nx*nx + ny*ny];
  },
  magnet: (cx, cy, zx, zy) => {
    const x2 = zx*zx, y2 = zy*zy;
    const nx = x2 - y2 + cx;
    const ny = 2*zx*zy + cy;
    const dr = 2*nx + cx - 2, di = 2*ny + cy;
    const d2 = dr*dr + di*di;
    if (d2 < 1e-12) return [nx, ny, 1e10];
    const qr = (nx*nx - ny*ny + cx - 1) / d2;
    const qi = (2*nx*ny + cy) / d2;
    const nx2 = qr*qr - qi*qi;
    const ny2 = 2*qr*qi;
    return [nx2, ny2, nx2*nx2 + ny2*ny2];
  },
  nova: (() => {
    const cRe = 1.0, cIm = 0.0;
    return (cx, cy, zx, zy) => {
      const zx0 = (zx === 0 && zy === 0) ? 1 : zx;
      const zy0 = (zx === 0 && zy === 0) ? 0 : zy;
      const x2 = zx0*zx0, y2 = zy0*zy0;
      const denom = (x2 + y2)*(x2 + y2)*(x2 + y2);
      if (denom < 1e-12) return [zx0, zy0, 1e10];
      const nx = zx0 - (zx0*zx0*zx0 - 3*zx0*y2 - cRe) / denom;
      const ny = zy0 - (3*x2*zy0 - zy0*zy0*zy0 - cIm) / denom;
      return [nx, ny, nx*nx + ny*ny];
    };
  })(),
  phoenix: (() => {
    const pRe = -0.5, pIm = 0.5;
    return (cx, cy, zx, zy) => {
      const x2 = zx*zx, y2 = zy*zy;
      const nx = x2 - y2 + pRe + pIm * zy;
      const ny = 2*zx*zy + pIm * zx;
      return [nx, ny, nx*nx + ny*ny];
    };
  })()
};

const REGIONS = {
  mandelbrot:   { cx: -0.7, cy: 0,   zoom: 1.5 },
  burning_ship: { cx: -0.5, cy: -0.5, zoom: 1.4 },
  tricorn:      { cx: -0.3, cy: 0,   zoom: 1.4 },
  magnet:       { cx: 1.0,  cy: 0,   zoom: 1.0 },
  nova:         { cx: 0.5,  cy: 0,   zoom: 1.0 },
  phoenix:      { cx: 0.0,  cy: 0.0, zoom: 1.2 }
};

/* ============================================================
   ГЕНЕРАТОРЫ (возвращают GrowingFractal)
   ============================================================ */

const activeFractals = [];

function makeEscapeFractal(name, noteNorm=0.5, vol=0.4){
  let formula = F[name];
  if (!formula) return null;
  if (name === 'julia'){
    const cRe = -0.75 + Math.random()*0.35;
    const cIm =  0.15 + Math.random()*0.25;
    formula = F.julia(cRe, cIm);
  }
  const region = REGIONS[name] || {cx:0,cy:0,zoom:1};
  const zoom = region.zoom * (1 + noteNorm * 2.0);
  const iter = Math.round(80 + noteNorm * 120);
  const pal = randomPalette();

  const f = new GrowingEscapeFractal(
    formula,
    { cx: region.cx, cy: region.cy, zoom },
    iter,
    pal,
    { buildSpeed: 0.006 + Math.random()*0.01 }
  );
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Koch snowflake — строим по сегментам ---------- */
function makeKoch(){
  const depth = 2 + Math.floor(Math.random()*3);
  const size = 280 + Math.random()*100;
  function kochSegs(x1,y1,x2,y2,d,out){
    if (d === 0){ out.push([x1,y1,x2,y2]); return; }
    const dx = x2-x1, dy = y2-y1;
    const x3 = x1+dx/3, y3 = y1+dy/3;
    const x4 = x1+2*dx/3, y4 = y1+2*dy/3;
    const ang = Math.PI/3;
    const x5 = x3 + (x4-x3)*Math.cos(ang) - (y4-y3)*Math.sin(ang);
    const y5 = y3 + (x4-x3)*Math.sin(ang) + (y4-y3)*Math.cos(ang);
    kochSegs(x1,y1,x3,y3,d-1,out);
    kochSegs(x3,y3,x5,y5,d-1,out);
    kochSegs(x5,y5,x4,y4,d-1,out);
    kochSegs(x4,y4,x2,y2,d-1,out);
  }
  const h = size*Math.sqrt(3)/2;
  const p1 = [0, -h/2], p2 = [size/2, h/2], p3 = [-size/2, h/2];
  const segsRaw = [];
  kochSegs(p1[0],p1[1],p2[0],p2[1],depth,segsRaw);
  kochSegs(p2[0],p2[1],p3[0],p3[1],depth,segsRaw);
  kochSegs(p3[0],p3[1],p1[0],p1[1],depth,segsRaw);

  const minX = -size/2, maxX = size/2, minY = -h/2, maxY = h/2;
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const baseColor = paletteCSS(pal, 0.5 + Math.random()*0.3);

  const segs = segsRaw.map(([x1,y1,x2,y2],i) => ({
    x1: x1*sc+ox, y1: y1*sc+oy,
    x2: x2*sc+ox, y2: y2*sc+oy,
    color: baseColor, lw: 1.4
  }));
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 2800 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Dragon curve ---------- */
function makeDragon(){
  const iterations = 10 + Math.floor(Math.random()*5);
  let turns = [];
  for (let i=1; i<=iterations; i++){
    const copy = turns.slice().reverse().map(t=>-t);
    turns = turns.concat([1], copy);
  }
  const size = 3 + Math.random()*4;
  let px = 0, py = 0, dir = 0;
  const pts = [[px,py]];
  for (const t of turns){
    dir = (dir + t + 4) % 4;
    px += [size,0,-size,0][dir];
    py += [0,-size,0,size][dir];
    pts.push([px,py]);
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x,y] of pts){
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = [];
  for (let i=0;i<pts.length-1;i++){
    const [x1,y1] = pts[i];
    const [x2,y2] = pts[i+1];
    const t = i / pts.length;
    segs.push({
      x1: x1*sc+ox, y1: y1*sc+oy,
      x2: x2*sc+ox, y2: y2*sc+oy,
      color: paletteCSS(pal, (t + Math.random()*0.1) % 1),
      lw: 1.5
    });
  }
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 2600 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Levy C curve ---------- */
function makeLevy(){
  const depth = 11 + Math.floor(Math.random()*3);
  const size = 300 + Math.random()*200;
  const segsRaw = [];
  function levy(x1,y1,x2,y2,d){
    if (d === 0){ segsRaw.push([x1,y1,x2,y2]); return; }
    const mx = (x1+x2)/2 + (y2-y1)/2;
    const my = (y1+y2)/2 - (x2-x1)/2;
    levy(x1,y1,mx,my,d-1);
    levy(mx,my,x2,y2,d-1);
  }
  levy(0,0,size,0,depth);

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x1,y1,x2,y2] of segsRaw){
    if (x1<minX)minX=x1; if (x1>maxX)maxX=x1;
    if (x2<minX)minX=x2; if (x2>maxX)maxX=x2;
    if (y1<minY)minY=y1; if (y1>maxY)maxY=y1;
    if (y2<minY)minY=y2; if (y2>maxY)maxY=y2;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = segsRaw.map(([x1,y1,x2,y2],i) => ({
    x1: x1*sc+ox, y1: y1*sc+oy,
    x2: x2*sc+ox, y2: y2*sc+oy,
    color: paletteCSS(pal, i / segsRaw.length),
    lw: 1.2
  }));
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 2400 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Hilbert curve ---------- */
function makeHilbert(){
  const order = 5 + Math.floor(Math.random()*2);
  const size = 300 / (Math.pow(2, order) - 1);
  let seq = 'A';
  for (let i=0;i<order;i++){
    let ns = '';
    for (const ch of seq){
      if (ch === 'A') ns += '+BF-AFA-FB+';
      else if (ch === 'B') ns += '-AF+BFB+FA-';
      else ns += ch;
    }
    seq = ns;
  }
  let px = 0, py = 0, dir = 0;
  const pts = [[px,py]];
  for (const ch of seq){
    if (ch === 'F'){
      px += Math.cos(dir*Math.PI/180) * size;
      py += Math.sin(dir*Math.PI/180) * size;
      pts.push([px,py]);
    } else if (ch === '+') dir = (dir + 90) % 360;
    else if (ch === '-') dir = (dir + 270) % 360;
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x,y] of pts){
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = [];
  for (let i=0;i<pts.length-1;i++){
    const [x1,y1] = pts[i];
    const [x2,y2] = pts[i+1];
    segs.push({
      x1: x1*sc+ox, y1: y1*sc+oy,
      x2: x2*sc+ox, y2: y2*sc+oy,
      color: paletteCSS(pal, i / pts.length),
      lw: 1.3
    });
  }
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 2800 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Pythagoras tree ---------- */
function makePythagoras(){
  const depth = 8 + Math.floor(Math.random()*2);
  const segsRaw = [];
  function branch(x1,y1,x2,y2,d){
    if (d === 0) return;
    segsRaw.push([x1,y1,x2,y2]);
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ux = dx/len, uy = dy/len;
    const nx = -uy, ny = ux;
    const s = len * 0.7071;
    branch(x2, y2, x2 + ux*s + nx*s, y2 + uy*s + ny*s, d-1);
    branch(x2, y2, x2 + ux*s - nx*s, y2 + uy*s - ny*s, d-1);
  }
  const trunk = 100 + Math.random()*50;
  branch(0, 0, 0, -trunk, depth);

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x1,y1,x2,y2] of segsRaw){
    if (x1<minX)minX=x1; if (x1>maxX)maxX=x1;
    if (x2<minX)minX=x2; if (x2>maxX)maxX=x2;
    if (y1<minY)minY=y1; if (y1>maxY)maxY=y1;
    if (y2<minY)minY=y2; if (y2>maxY)maxY=y2;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = segsRaw.map(([x1,y1,x2,y2],i) => ({
    x1: x1*sc+ox, y1: y1*sc+oy,
    x2: x2*sc+ox, y2: y2*sc+oy,
    color: paletteCSS(pal, i / segsRaw.length),
    lw: 1.2
  }));
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 3000 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Sierpinski triangle ---------- */
function makeSierpinski(){
  const depth = 4 + Math.floor(Math.random()*3);
  const size = 400 + Math.random()*200;
  const tris = [];
  function sierpinski(x1,y1,x2,y2,x3,y3,d){
    if (d === 0){
      tris.push([x1,y1,x2,y2,x3,y3]);
      return;
    }
    const x12=(x1+x2)/2, y12=(y1+y2)/2;
    const x23=(x2+x3)/2, y23=(y2+y3)/2;
    const x31=(x3+x1)/2, y31=(y3+y1)/2;
    sierpinski(x1,y1,x12,y12,x31,y31,d-1);
    sierpinski(x12,y12,x2,y2,x23,y23,d-1);
    sierpinski(x31,y31,x23,y23,x3,y3,d-1);
  }
  const h = size*Math.sqrt(3)/2;
  sierpinski(0, -h/3, size/2, h*2/3, -size/2, h*2/3, depth);

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const t of tris){
    for (let i=0;i<6;i+=2){
      if (t[i]<minX)minX=t[i]; if (t[i]>maxX)maxX=t[i];
      if (t[i+1]<minY)minY=t[i+1]; if (t[i+1]>maxY)maxY=t[i+1];
    }
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = [];
  for (const t of tris){
    // три сегмента на треугольник
    const pts = [
      [t[0]*sc+ox, t[1]*sc+oy],
      [t[2]*sc+ox, t[3]*sc+oy],
      [t[4]*sc+ox, t[5]*sc+oy],
      [t[0]*sc+ox, t[1]*sc+oy]
    ];
    const col = paletteCSS(pal, Math.random());
    for (let i=0;i<3;i++){
      segs.push({x1:pts[i][0], y1:pts[i][1], x2:pts[i+1][0], y2:pts[i+1][1], color:col, lw:1.0});
    }
  }
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 3200 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Barnsley fern (точки) ---------- */
function makeFern(){
  const points = 12000 + Math.floor(Math.random()*6000);
  const scale = 60 + Math.random()*40;
  let px = 0, py = 0;
  const raw = [];
  for (let i=0;i<points;i++){
    const r = Math.random();
    let nx, ny;
    if (r < 0.01)      { nx = 0;                ny = 0.16*py; }
    else if (r < 0.86) { nx = 0.85*px + 0.04*py; ny = -0.04*px + 0.85*py + 1.6; }
    else if (r < 0.93) { nx = 0.20*px - 0.26*py; ny = 0.23*px + 0.22*py + 1.6; }
    else               { nx = -0.15*px + 0.28*py; ny = 0.26*px + 0.24*py + 0.44; }
    px = nx; py = ny;
    if (i > 20) raw.push([px*scale, -py*scale]);
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x,y] of raw){
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.7)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  // цвета по прогрессу роста — снизу (ствол) к верхушке (ярче)
  const pointsArr = raw.map(([x,y]) => {
    const t = (y - minY) / ch; // 0..1
    return {
      x: x*sc+ox, y: y*sc+oy,
      r: 1.2 + Math.random()*0.8,
      color: paletteCSS(pal, 0.3 + t*0.7)
    };
  });
  const f = new GrowingPointFractal(pointsArr, pal, { buildDuration: 3500 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Аттракторы (Clifford/De Jong) ---------- */
function makeAttractor(){
  const isDeJong = Math.random() > 0.5;
  const a = -2.5 + Math.random()*5;
  const b = -2.5 + Math.random()*5;
  const c = -2.5 + Math.random()*5;
  const dd = -2.5 + Math.random()*5;
  const nPoints = 18000;
  const scale = 80 + Math.random()*60;
  let px = 0.1, py = 0.1;
  const raw = [];
  for (let i=0;i<nPoints;i++){
    let nx, ny;
    if (isDeJong){
      nx = Math.sin(a*py) - Math.cos(b*px);
      ny = Math.sin(c*px) - Math.cos(dd*py);
    } else {
      nx = Math.sin(a*py) + c*Math.cos(a*px);
      ny = Math.sin(b*px) + dd*Math.cos(b*py);
    }
    px = nx; py = ny;
    if (i > 100) raw.push([px*scale, py*scale]);
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x,y] of raw){
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.8)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const points = raw.map(([x,y],i) => ({
    x: x*sc+ox, y: y*sc+oy,
    r: 0.9 + Math.random()*0.6,
    color: paletteCSS(pal, (i / raw.length + Math.random()*0.15) % 1)
  }));
  const f = new GrowingPointFractal(points, pal, { buildDuration: 3800 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Lorenz (3D) ---------- */
function makeLorenz(){
  const sigma = 10, rho = 28, beta = 8/3, dt = 0.005;
  let x = 0.1, y = 0, z = 0;
  const raw = [];
  for (let i=0;i<3500;i++){
    const dx = sigma*(y-x);
    const dy = x*(rho-z)-y;
    const dz = x*y - beta*z;
    x += dx*dt; y += dy*dt; z += dz*dt;
    raw.push([x, z]);
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x,y] of raw){
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.7)/cw, (H*0.8)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = [];
  for (let i=0;i<raw.length-1;i++){
    const [x1,y1] = raw[i];
    const [x2,y2] = raw[i+1];
    segs.push({
      x1: x1*sc+ox, y1: y1*sc+oy,
      x2: x2*sc+ox, y2: y2*sc+oy,
      color: paletteCSS(pal, i / raw.length),
      lw: 1.0
    });
  }
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 3000 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ---------- Дерево (случайное) ---------- */
function makeTree(){
  const depth = 5 + Math.floor(Math.random()*3);
  const len0 = 90 + Math.random()*40;
  const segsRaw = [];
  function branch(x, y, len, ang, d){
    if (d === 0) return;
    const ex = x + len*Math.cos(ang);
    const ey = y - len*Math.sin(ang);
    segsRaw.push([x,y,ex,ey]);
    const nl = len*0.72;
    branch(ex, ey, nl, ang - 0.45 + Math.random()*0.2, d-1);
    branch(ex, ey, nl, ang + 0.35 + Math.random()*0.2, d-1);
    if (Math.random() > 0.6) branch(ex, ey, nl*0.7, ang, d-1);
  }
  branch(0, 300, len0, -Math.PI/2, depth);

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const [x1,y1,x2,y2] of segsRaw){
    if (x1<minX)minX=x1; if (x1>maxX)maxX=x1;
    if (x2<minX)minX=x2; if (x2>maxX)maxX=x2;
    if (y1<minY)minY=y1; if (y1>maxY)maxY=y1;
    if (y2<minY)minY=y2; if (y2>maxY)maxY=y2;
  }
  const cw = maxX-minX, ch = maxY-minY;
  const sc = Math.min((W*0.7)/cw, (H*0.9)/ch);
  const ox = (W - cw*sc)/2 - minX*sc;
  const oy = (H - ch*sc)/2 - minY*sc;

  const pal = randomPalette();
  const segs = segsRaw.map(([x1,y1,x2,y2],i) => ({
    x1: x1*sc+ox, y1: y1*sc+oy,
    x2: x2*sc+ox, y2: y2*sc+oy,
    color: paletteCSS(pal, i / segsRaw.length),
    lw: 1.2
  }));
  const f = new GrowingVectorFractal(segs, pal, { buildDuration: 3000 });
  activeFractals.push(f);
  shapeCount++;
  return f;
}

/* ============================================================
   МУЗЫКА
   ============================================================ */
function generateMelody(){
  if (!audioContext) return null;
  const scaleNames = Object.keys(scales);
  currentScale = scaleNames[Math.floor(Math.random()*scaleNames.length)];
  currentStyle = styles[Math.floor(Math.random()*styles.length)];
  tempo = 80 + Math.floor(Math.random()*80);
  const scale = scales[currentScale];
  melodyNotes = [];
  const noteCount = 16 + Math.floor(Math.random()*16);
  const rhythmPatterns = [
    [1,1,1,1],[1,0.5,0.5,1],[2,1,0.5,0.5],[1.5,0.5,1,1]
  ];
  const rhythm = rhythmPatterns[Math.floor(Math.random()*rhythmPatterns.length)];
  for (let i=0;i<noteCount;i++){
    const ni = Math.floor(Math.random()*scale.length);
    const freq = scale[ni];
    const di = i % rhythm.length;
    const dur = (60/tempo) * rhythm[di];
    const volume = 0.2 + Math.random()*0.3;
    let waveType = 'sine';
    if (currentStyle === 'electronic') waveType = ['sawtooth','square','triangle'][Math.floor(Math.random()*3)];
    else if (currentStyle === 'techno') waveType = 'square';
    else if (currentStyle === 'jazz') waveType = ['sine','triangle'][Math.floor(Math.random()*2)];
    melodyNotes.push({
      frequency: freq, duration: dur, volume, waveType,
      noteIndexInScale: ni, scaleLen: scale.length
    });
  }
  updateMusicInfo();
  return melodyNotes;
}

function playMelody(){
  if (!audioContext || !currentMelody || isPlaying) return;
  if (audioContext.state === 'suspended') audioContext.resume();
  isPlaying = true;
  melodyStartTime = audioContext.currentTime;
  nextNoteTime = melodyStartTime;
  noteIndex = 0;
  scheduleNotes();
}

function scheduleNotes(){
  if (!isPlaying || !audioContext) return;
  const currentTime = audioContext.currentTime;
  while (nextNoteTime < currentTime + 0.15 && noteIndex < currentMelody.length){
    const note = currentMelody[noteIndex];
    const noteTime = nextNoteTime;
    playNote(note.frequency, note.duration, note.waveType, note.volume, noteTime);
    const noteNorm = note.noteIndexInScale / note.scaleLen;
    setTimeout(()=>{
      if (isPlaying){
        currentNoteNorm = noteNorm;
        currentVol = note.volume;
        createMusicShape(noteNorm, note.volume);
      }
    }, Math.max(0, (noteTime - audioContext.currentTime) * 1000));
    nextNoteTime += note.duration;
    noteIndex++;
    if (noteIndex >= currentMelody.length) noteIndex = 0;
  }
  if (isPlaying) requestAnimationFrame(scheduleNotes);
}

function playNote(freq, duration, waveType, volume, startTime){
  if (!audioContext) return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = waveType;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(analyser || audioContext.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function stopMelody(){ isPlaying = false; }

function updateMusicInfo(){
  musicInfo.textContent = `Темп: ${tempo} | Гамма: ${currentScale} | Стиль: ${currentStyle}`;
}

/* ---------- связь музыки и фракталов ---------- */
function createMusicShape(noteNorm, vol){
  const styleMap = {
    ambient:    ['mandelbrot','julia','attractor','fern','levy'],
    electronic: ['burning_ship','tricorn','mandelbrot','julia','attractor','dragon','sierpinski'],
    classical:  ['koch','pythagoras','tree','hilbert','levy','sierpinski'],
    jazz:       ['julia','phoenix','nova','fern','attractor','dragon'],
    techno:     ['burning_ship','magnet','mandelbrot','tricorn','lorenz'],
    random:     ['mandelbrot','julia','burning_ship','tricorn','magnet','nova','phoenix',
                 'koch','pythagoras','tree','hilbert','dragon','levy','fern',
                 'attractor','lorenz','sierpinski']
  };
  const pool = styleMap[currentStyle] || styleMap.random;
  const type = pool[Math.floor(Math.random()*pool.length)];
  switch(type){
    case 'mandelbrot':   makeEscapeFractal('mandelbrot', noteNorm, vol); break;
    case 'julia':        makeEscapeFractal('julia', noteNorm, vol); break;
    case 'burning_ship': makeEscapeFractal('burning_ship', noteNorm, vol); break;
    case 'tricorn':      makeEscapeFractal('tricorn', noteNorm, vol); break;
    case 'magnet':       makeEscapeFractal('magnet', noteNorm, vol); break;
    case 'nova':         makeEscapeFractal('nova', noteNorm, vol); break;
    case 'phoenix':      makeEscapeFractal('phoenix', noteNorm, vol); break;
    case 'koch':         makeKoch(); break;
    case 'dragon':       makeDragon(); break;
    case 'levy':         makeLevy(); break;
    case 'hilbert':      makeHilbert(); break;
    case 'pythagoras':   makePythagoras(); break;
    case 'sierpinski':   makeSierpinski(); break;
    case 'fern':         makeFern(); break;
    case 'attractor':    makeAttractor(); break;
    case 'lorenz':       makeLorenz(); break;
    case 'tree':         makeTree(); break;
  }
}

/* ============================================================
   ВИЗУАЛИЗАТОР
   ============================================================ */
let visAnim = null;
function drawVisualizer(){
  if (visAnim) cancelAnimationFrame(visAnim);
  const loop = () => {
    visAnim = requestAnimationFrame(loop);
    visualizerCtx.clearRect(0,0,visualizerCanvas.width,visualizerCanvas.height);
    if (!isPlaying || !analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const bw = visualizerCanvas.width / data.length;
    for (let i=0;i<data.length;i++){
      const h = (data[i]/255) * visualizerCanvas.height;
      visualizerCtx.fillStyle = `rgb(0,${180 + data[i]/2},0)`;
      visualizerCtx.fillRect(i*bw, visualizerCanvas.height - h, Math.max(1, bw-1), h);
    }
  };
  loop();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let lastFrameTime = performance.now();
let generationTimer = 0;
let generationInterval = 1200;

function updateStats(){
  frameCount++;
  const now = Date.now();
  if (now - lastFpsUpdate >= 1000){
    fps = Math.round((frameCount*1000)/(now - lastFpsUpdate));
    frameCount = 0;
    lastFpsUpdate = now;
    const mel = isPlaying ? 'Играет' : 'Стоп';
    info.textContent = `Фигур: ${shapeCount} | FPS: ${fps} | Мелодия: ${mel} | Строится: ${activeFractals.filter(f=>f.state==='building').length}`;
  }
}

function cleanupFractals(){
  for (let i=activeFractals.length-1;i>=0;i--){
    if (activeFractals[i].isDead()) activeFractals.splice(i,1);
  }
  // Потолок — 10 одновременно
  const MAX = 10;
  while (activeFractals.length > MAX){
    activeFractals.shift();
  }
}

function renderFrame(now){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // обновляем и рисуем все активные фракталы
  for (const f of activeFractals){
    f.update(now);
    f.draw(ctx);
  }

  // виньетка
  const vg = ctx.createRadialGradient(W/2,H/2, H*0.3, W/2,H/2, H*0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

function mainLoop(now){
  updateStats();
  cleanupFractals();

  // генерация независимо от музыки
  if (now - generationTimer > generationInterval){
    generationTimer = now;
    const r = Math.random();
    if (r < 0.5){
      const heavy = ['mandelbrot','julia','burning_ship','tricorn','magnet','nova','phoenix'];
      const t = heavy[Math.floor(Math.random()*heavy.length)];
      makeEscapeFractal(t, Math.random(), 0.4);
    } else {
      const fn = [makeKoch, makeDragon, makeLevy, makeHilbert, makePythagoras,
                  makeSierpinski, makeFern, makeAttractor, makeLorenz, makeTree];
      fn[Math.floor(Math.random()*fn.length)]();
    }
    generationInterval = 1400 + Math.random()*1400;
  }

  renderFrame(now);
  requestAnimationFrame(mainLoop);
}

/* ============================================================
   КНОПКИ
   ============================================================ */
document.getElementById('playMelody').addEventListener('click', ()=>{
  if (!currentMelody) currentMelody = generateMelody();
  if (!isPlaying){ playMelody(); drawVisualizer(); }
});
document.getElementById('stopMelody').addEventListener('click', ()=>{ stopMelody(); });
document.getElementById('newMelody').addEventListener('click', ()=>{
  stopMelody();
  currentMelody = generateMelody();
  if (autoPlay) setTimeout(()=>{ playMelody(); }, 400);
});
document.getElementById('toggleAuto').addEventListener('click', function(){
  autoPlay = !autoPlay;
  this.textContent = autoPlay ? '🔁 Авто: ВКЛ' : '🔁 Авто: ВЫКЛ';
});

/* ============================================================
   BOOT
   ============================================================ */
initAudio();
currentMelody = generateMelody();
drawVisualizer();
requestAnimationFrame(mainLoop);

setTimeout(()=>{
  if (autoPlay && audioContext && !isPlaying) playMelody();
}, 800);

setInterval(()=>{
  if (autoPlay && audioContext){
    stopMelody();
    currentMelody = generateMelody();
    setTimeout(()=>{ if (autoPlay) playMelody(); }, 400);
  }
}, 30000);

setTimeout(()=>location.reload(), 900000);
</script>
